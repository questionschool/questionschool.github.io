<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야심찬 목표나무 (Ambitious Target Tree)</title>
<style>
  :root{
    --green-900:#0d3b2e; --green-700:#14654c; --green-600:#1a7a5c; --green-500:#219a72;
    --green-100:#e3f4ec; --green-50:#f2faf6;
    --amber-600:#b45309; --amber-50:#fff8eb;
    --red-600:#b91c1c; --red-50:#fdf0ef;
    --ink:#1c2b26; --ink-soft:#5a6b64; --line:#d8e6df;
    --card-shadow:0 1px 3px rgba(13,59,46,.08), 0 4px 14px rgba(13,59,46,.07);
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    background:linear-gradient(160deg,#f4faf7 0%,#eef6f1 55%,#e9f3ee 100%);
    color:var(--ink); min-height:100vh; line-height:1.55;
  }
  button{font:inherit; cursor:pointer;}
  textarea,input[type=text]{
    font:inherit; width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:10px 12px; background:#fff; color:var(--ink); resize:vertical;
  }
  textarea:focus,input[type=text]:focus{outline:none; border-color:var(--green-500); box-shadow:0 0 0 3px rgba(33,154,114,.15);}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:50; background:rgba(244,250,247,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:10px 20px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; color:var(--green-900);}
  .logo svg{flex:none;}
  .logo small{display:block; font-weight:500; font-size:11px; color:var(--ink-soft); letter-spacing:.02em;}
  .tabs{display:flex; gap:4px; background:#e2ede7; border-radius:10px; padding:4px;}
  .tabs button{border:none; background:transparent; padding:6px 14px; border-radius:8px; font-weight:600; color:var(--ink-soft);}
  .tabs button.on{background:#fff; color:var(--green-900); box-shadow:0 1px 3px rgba(13,59,46,.12);}
  .spacer{flex:1;}
  .hbtns{display:flex; gap:8px; flex-wrap:wrap;}
  .hbtns button{
    border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:6px 12px;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .hbtns button:hover{border-color:var(--green-500); color:var(--green-700);}

  main{max-width:1100px; margin:0 auto; padding:26px 20px 80px;}

  /* ---------- wizard ---------- */
  .steps{display:flex; gap:0; margin-bottom:26px; overflow-x:auto;}
  .step-pill{
    flex:1; min-width:110px; text-align:center; padding:10px 6px 12px; position:relative;
    color:var(--ink-soft); font-size:13px; font-weight:600; border-bottom:3px solid var(--line);
    background:none; border-top:none; border-left:none; border-right:none;
  }
  .step-pill .n{
    display:inline-flex; width:24px; height:24px; border-radius:50%; align-items:center; justify-content:center;
    background:#dfeae4; color:var(--ink-soft); font-size:12px; font-weight:700; margin-bottom:4px;
  }
  .step-pill.done .n{background:var(--green-500); color:#fff;}
  .step-pill.cur{color:var(--green-900); border-bottom-color:var(--green-500);}
  .step-pill.cur .n{background:var(--green-900); color:#fff;}
  .step-pill:disabled{cursor:default;}
  .step-pill:not(:disabled):hover{color:var(--green-700);}

  .wizard{display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start;}
  @media(max-width:860px){.wizard{grid-template-columns:1fr;}}
  .panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:24px;}
  .panel h2{font-size:19px; color:var(--green-900); margin-bottom:4px;}
  .panel .sub{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .guide{background:var(--green-50); border:1px solid #cfe7db; border-radius:var(--radius); padding:18px 20px; font-size:13.5px;}
  .guide h3{font-size:13px; color:var(--green-700); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .guide ul{padding-left:18px; display:flex; flex-direction:column; gap:8px; color:#2c443b;}
  .guide .q{background:#fff; border-left:3px solid var(--green-500); border-radius:6px; padding:8px 11px; margin-top:12px; color:var(--green-900); font-weight:600; font-size:13px;}
  .guide .ex{margin-top:12px; padding-top:10px; border-top:1px dashed #bcd9cc; color:var(--ink-soft);}
  .guide .ex b{color:var(--ink);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:700; font-size:13.5px; margin-bottom:6px; color:var(--ink);}
  .field .hint{font-weight:400; color:var(--ink-soft); font-size:12.5px; margin-left:4px;}

  .nav{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}
  .btn{border:none; border-radius:10px; padding:10px 20px; font-weight:700; font-size:14.5px;}
  .btn.primary{background:var(--green-600); color:#fff;}
  .btn.primary:hover{background:var(--green-700);}
  .btn.ghost{background:#eef4f1; color:var(--ink-soft);}
  .btn.ghost:hover{color:var(--ink);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* obstacle / io lists */
  .obs-row{display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;}
  .obs-row .idx{
    flex:none; width:26px; height:26px; margin-top:8px; border-radius:8px; background:var(--red-50);
    color:var(--red-600); font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .obs-row textarea{min-height:44px;}
  .icon-btn{flex:none; margin-top:5px; border:none; background:none; color:#b7c6bf; font-size:17px; padding:6px; border-radius:8px;}
  .icon-btn:hover{color:var(--red-600); background:var(--red-50);}

  .io-pair{border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:#fdfefd;}
  .io-pair .ob{
    display:flex; gap:8px; align-items:baseline; font-size:13.5px; color:var(--red-600);
    background:var(--red-50); border-radius:8px; padding:8px 11px; margin-bottom:10px;
  }
  .io-pair .ob b{flex:none; font-size:12px; letter-spacing:.03em;}
  .io-pair .arrow{ text-align:center; color:var(--green-500); font-size:15px; margin:2px 0 8px; font-weight:700;}
  .io-pair label{font-size:12.5px; font-weight:700; color:var(--green-700); display:block; margin-bottom:5px;}
  .io-pair textarea{min-height:44px;}
  .io-pair .check{margin-top:8px; font-size:12.5px; color:var(--ink-soft);}

  /* step 4 sequencing */
  .seq-help{background:var(--amber-50); border:1px solid #f3dfb6; color:#7c5210; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px;}
  .seq-list{display:flex; flex-direction:column;}
  .seq-item{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:grab;
  }
  .seq-item.dragging{opacity:.4;}
  .seq-item .lv{
    flex:none; min-width:44px; text-align:center; background:var(--green-100); color:var(--green-700);
    font-weight:800; font-size:12px; border-radius:8px; padding:5px 6px;
  }
  .seq-item .txt{flex:1; font-size:14px;}
  .seq-item .txt small{display:block; color:var(--ink-soft); font-size:12px; margin-top:2px;}
  .seq-item .mv{display:flex; flex-direction:column; gap:2px;}
  .seq-item .mv button, .seq-item .par{
    border:1px solid var(--line); background:#fff; border-radius:7px; font-size:12px; padding:2px 8px; color:var(--ink-soft);
  }
  .seq-item .mv button:hover{border-color:var(--green-500); color:var(--green-700);}
  .seq-item .par{align-self:center; white-space:nowrap;}
  .seq-item .par.on{background:var(--green-600); border-color:var(--green-600); color:#fff;}
  .seq-gap{height:4px;}
  .seq-gap.over{height:34px; border:2px dashed var(--green-500); border-radius:10px; background:var(--green-50); margin-bottom:8px;}

  /* ---------- tree ---------- */
  .tree-wrap{display:grid; grid-template-columns:1fr 300px; gap:22px; align-items:start;}
  @media(max-width:900px){.tree-wrap{grid-template-columns:1fr;}}
  .tree-board{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:30px 26px 34px;}
  .tree-title{text-align:center; margin-bottom:4px; font-size:13px; color:var(--ink-soft); font-weight:600; letter-spacing:.04em;}
  .tree{display:flex; flex-direction:column; align-items:center;}
  .goal-node{
    background:linear-gradient(135deg,var(--green-700),var(--green-900)); color:#fff;
    border-radius:100px; padding:18px 34px; max-width:560px; text-align:center;
    box-shadow:0 6px 20px rgba(13,59,46,.25); position:relative;
  }
  .goal-node .tag{font-size:11px; font-weight:700; letter-spacing:.12em; opacity:.75; margin-bottom:4px;}
  .goal-node .txt{font-size:16.5px; font-weight:700; line-height:1.45; white-space:pre-wrap;}
  .goal-node .by{font-size:12px; opacity:.8; margin-top:5px;}
  .tree-arrow{color:var(--green-500); margin:6px 0; flex:none;}
  .level{width:100%; max-width:860px;}
  .level-label{text-align:center; font-size:11.5px; font-weight:800; color:var(--green-600); letter-spacing:.08em; margin-bottom:8px;}
  .level-cards{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .io-card{
    background:var(--green-50); border:1.5px solid #c8e2d5; border-radius:12px; padding:12px 14px;
    width:min(100%,320px); flex:1 1 240px; max-width:340px; position:relative; transition:box-shadow .15s;
  }
  .io-card:hover{box-shadow:var(--card-shadow);}
  .io-card.done{background:#f2f7f4; border-color:#d9e6df;}
  .io-card.done .io-txt{color:#7d938a; text-decoration:line-through; text-decoration-color:rgba(33,154,114,.5);}
  .io-card .io-txt{font-size:14px; font-weight:600; color:var(--green-900); white-space:pre-wrap;}
  .io-card .ob-txt{margin-top:8px; font-size:12px; color:var(--red-600); background:var(--red-50); border-radius:7px; padding:5px 8px; white-space:pre-wrap;}
  .io-card .ob-txt b{font-size:10.5px; letter-spacing:.04em;}
  .io-card .card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:9px;}
  .io-card .done-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .io-card .edit-link{border:none; background:none; font-size:12px; color:var(--green-600); font-weight:700; padding:2px 4px; border-radius:6px;}
  .io-card .edit-link:hover{background:var(--green-100);}
  .progress-line{margin:0 auto 22px; max-width:400px; text-align:center;}
  .progress-line .bar{height:8px; background:#e2ede7; border-radius:99px; overflow:hidden; margin-top:6px;}
  .progress-line .bar i{display:block; height:100%; background:var(--green-500); border-radius:99px; transition:width .3s;}
  .progress-line small{color:var(--ink-soft); font-size:12.5px;}

  .side-panel{display:flex; flex-direction:column; gap:16px;}
  .readout{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; font-size:13px;}
  .readout h3{font-size:13px; color:var(--green-700); margin-bottom:10px; letter-spacing:.05em;}
  .readout ol{padding-left:18px; display:flex; flex-direction:column; gap:7px; color:#2c443b;}
  .readout .final{margin-top:10px; font-weight:700; color:var(--green-900);}
  .checklist label{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0; cursor:pointer; color:#2c443b;}
  .checklist input{margin-top:3px; accent-color:var(--green-600);}

  .empty{
    text-align:center; padding:70px 30px; color:var(--ink-soft);
  }
  .empty .big{font-size:40px; margin-bottom:10px;}
  .empty button{margin-top:16px;}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(13,32,26,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:#fff; border-radius:16px; padding:24px; width:min(520px,100%); box-shadow:0 20px 60px rgba(0,0,0,.3); max-height:90vh; overflow:auto;}
  .modal h3{color:var(--green-900); margin-bottom:14px; font-size:17px;}
  .modal .nav{margin-top:18px;}
  .modal .danger{background:var(--red-50); color:var(--red-600);}

  /* ---------- AI feedback & suggestions ---------- */
  .fb{font-size:12px; border-radius:7px; padding:5px 9px; margin:2px 0 8px 34px; line-height:1.45;}
  .fb.ok{background:var(--green-100); color:var(--green-700);}
  .fb.bad{background:var(--amber-50); color:var(--amber-600);}
  .fb b{font-size:11px;}
  .ai-overall{background:var(--green-50); border:1px solid #cfe7db; border-radius:10px; padding:10px 13px; font-size:13px; color:#2c443b; margin-bottom:12px;}
  .ai-sugs{border-top:1px dashed var(--line); margin-top:14px; padding-top:12px;}
  .ai-sugs h4{font-size:13px; color:var(--green-700); margin-bottom:8px;}
  .ai-sug-row{display:flex; gap:8px; align-items:center; font-size:13.5px; background:#f6faf8; border-radius:9px; padding:8px 11px; margin-bottom:6px;}
  .ai-sug-row span{flex:1;}
  .ai-sug-row button{border:1px solid var(--line); background:#fff; border-radius:7px; padding:3px 10px; font-size:12px; font-weight:700; color:var(--green-700);}
  .ai-sug-row button:hover{border-color:var(--green-500);}
  .ai-sug-row button.hide{color:#b7c6bf;}
  .ai-score{display:inline-flex; align-items:center; gap:6px; background:var(--green-900); color:#fff; border-radius:99px; padding:4px 12px; font-size:12.5px; font-weight:700;}

  /* ---------- action plan (step 5) ---------- */
  .ap-io{border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:#fdfefd;}
  .ap-io .ap-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .ap-io .ap-head .lv{flex:none; background:var(--green-100); color:var(--green-700); font-weight:800; font-size:11.5px; border-radius:7px; padding:4px 8px;}
  .ap-io .ap-head .io{font-size:14px; font-weight:700; color:var(--green-900); flex:1;}
  .ap-row{display:grid; grid-template-columns:1fr 110px 110px 30px; gap:6px; margin-bottom:6px; align-items:center;}
  .ap-row input{font:inherit; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:7px 10px; width:100%;}
  .ap-row input:focus{outline:none; border-color:var(--green-500);}
  .ap-row .del{border:none; background:none; color:#b7c6bf; font-size:15px; cursor:pointer; padding:4px;}
  .ap-row .del:hover{color:var(--red-600);}
  .ap-add{display:flex; gap:8px; margin-top:8px;}
  .ap-add button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .ap-add button:hover{border-color:var(--green-500); color:var(--green-700);}
  .ap-hint{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}

  /* ---------- master plan table ---------- */
  .mp-wrap{margin-top:30px;}
  .mp-wrap h3{text-align:center; font-size:14px; color:var(--green-900); letter-spacing:.04em; margin-bottom:12px;}
  .mp-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .mp-table th{background:var(--green-900); color:#fff; padding:7px 10px; text-align:left; font-size:11.5px; letter-spacing:.04em;}
  .mp-table td{border:1px solid var(--line); padding:7px 10px; vertical-align:top;}
  .mp-table td.lv{white-space:nowrap; font-weight:800; color:var(--green-700); background:var(--green-50); font-size:11.5px;}
  .mp-table td.io{font-weight:600; color:var(--green-900);}
  .mp-table td.meta{white-space:nowrap; color:var(--ink-soft);}
  .mp-table tr.empty td{color:#b7c6bf; font-style:italic;}

  /* ---------- target coach ---------- */
  .coach-btn{
    display:flex; align-items:center; gap:7px; width:100%; justify-content:center;
    border:1.5px dashed #b9d9c9; background:var(--green-50); color:var(--green-700);
    border-radius:10px; padding:9px 14px; font-weight:700; font-size:13.5px; margin:-6px 0 16px;
  }
  .coach-btn:hover{background:var(--green-100); border-style:solid;}
  .modal.wide{width:min(680px,100%);}
  .diag{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
  .diag-row{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; padding:8px 11px; border-radius:9px; background:#f6faf8;}
  .diag-row .mark{flex:none; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:1px;}
  .diag-row.ok .mark{background:var(--green-100); color:var(--green-700);}
  .diag-row.bad{background:var(--red-50);}
  .diag-row.bad .mark{background:#f6d5d2; color:var(--red-600);}
  .diag-row.ask{background:var(--amber-50);}
  .diag-row.ask .mark{background:#f3dfb6; color:var(--amber-600);}
  .diag-row b{display:block; font-size:13px;}
  .diag-row small{color:var(--ink-soft); font-size:12.5px; line-height:1.45;}
  .sug-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:18px 0 8px;}
  .sug-head h4{font-size:14px; color:var(--green-900);}
  .sug-head .src{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:#eef4f1; color:var(--ink-soft);}
  .sug-head .src.ai{background:var(--green-100); color:var(--green-700);}
  .sug-card{border:1.5px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:9px; background:#fff;}
  .sug-card .t{font-size:14px; font-weight:600; color:var(--ink); white-space:pre-wrap;}
  .sug-card .w{font-size:12.5px; color:var(--ink-soft); margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);}
  .sug-card .use{margin-top:9px; border:none; background:var(--green-600); color:#fff; border-radius:8px; padding:6px 14px; font-size:12.5px; font-weight:700;}
  .sug-card .use:hover{background:var(--green-700);}
  .sug-note{font-size:12px; color:var(--ink-soft); margin:4px 0 0;}
  .ai-box{margin-top:16px; border-top:1px solid var(--line); padding-top:12px;}
  .ai-box summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-soft); user-select:none;}
  .ai-box summary:hover{color:var(--green-700);}
  .ai-box .inner{margin-top:10px; display:flex; flex-direction:column; gap:9px;}
  .ai-box input{font:inherit; font-size:13px; width:100%; border:1.5px solid var(--line); border-radius:9px; padding:8px 11px;}
  .ai-box .note{font-size:12px; color:var(--ink-soft); line-height:1.5;}
  .ai-run{border:none; background:var(--green-900); color:#fff; border-radius:9px; padding:8px 16px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:7px;}
  .ai-run:hover{background:var(--green-700);}
  .ai-run:disabled{opacity:.5; cursor:wait;}
  .ai-err{font-size:12.5px; color:var(--red-600); background:var(--red-50); border-radius:8px; padding:8px 11px;}
  .spin{display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200;
    background:var(--green-900); color:#fff; padding:10px 20px; border-radius:99px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* ---------- export capture ---------- */
  body.exporting .no-print{display:none !important;}
  body.exporting .edit-link{display:none !important;}
  body.exporting .done-toggle{display:none !important;}

  /* ---------- print ---------- */
  @media print{
    body{background:#fff;}
    header, .side-panel, .no-print{display:none !important;}
    main{padding:0; max-width:none;}
    .tree-wrap{grid-template-columns:1fr;}
    .tree-board{border:none; box-shadow:none; padding:10px 0;}
    .io-card{break-inside:avoid;}
    .io-card .edit-link, .io-card .done-toggle input{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="8" r="5.5" fill="#1a7a5c"/>
      <circle cx="8.5" cy="15" r="4.5" fill="#219a72"/>
      <circle cx="21.5" cy="15" r="4.5" fill="#219a72"/>
      <rect x="13.4" y="14" width="3.2" height="10" rx="1.4" fill="#7a5230"/>

<script>
"use strict";
/* ================= state ================= */
const LEVEL_NAMES = i => (i+1) + "단";
let state = blankState();
let view = "wizard";           // wizard | tree
let step = 1;                  // 1..5
let checkboxes = {};           // step5 review checklist (session only)

function blankState(){
  return { app:"att", version:1, title:"", target:"", deadline:"", items:[] };
}
function uid(){ return "i" + Math.random().toString(36).slice(2,9); }
function newItem(){ return {id:uid(), obstacle:"", io:"", parallel:false, done:false, actions:[]}; }
function normalizeItem(it){
  it.id = it.id||uid(); it.obstacle = it.obstacle||""; it.io = it.io||"";
  it.parallel = !!it.parallel; it.done = !!it.done;
  it.actions = Array.isArray(it.actions)? it.actions : [];
  it.actions.forEach(a=>{ a.id = a.id||uid(); a.task = a.task||""; a.who = a.who||""; a.when = a.when||""; });
  return it;
}
function esc(s){ return (s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* levels: group items by parallel flag (first item never parallel) */
function levels(){
  const lv = [];
  state.items.forEach((it,i)=>{
    if(i===0 || !it.parallel) lv.push([it]);
    else lv[lv.length-1].push(it);
  });
  return lv;
}
function findItem(id){ return state.items.find(x=>x.id===id); }

/* ================= persistence ================= */
function saveFile(){
  const name = (state.title || "목표나무").replace(/[\\/:*?"<>|]/g,"_");
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".att.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("파일로 저장했습니다");
}
function loadFile(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.app!=="att" || !Array.isArray(d.items)) throw 0;
      d.items.forEach(normalizeItem);
      state = Object.assign(blankState(), d);
      step = state.target ? (state.items.length? (state.items.every(i=>i.io)?6:3) : 2) : 1;
      view = state.items.length && state.items.every(i=>i.io) ? "tree" : "wizard";
      render(); toast("불러왔습니다: " + (state.title||"제목 없음"));
    }catch(e){ toast("올바른 목표나무 파일(.att.json)이 아닙니다"); }
  };
  r.readAsText(file);
}

       actions:[{id:uid(), task:"기존 코칭 세션 기록에서 핵심 모듈 8개 추출", who:"본인", when:"8월 2주"},{id:uid(), task:"회기별 워크시트·운영 매뉴얼 초안 작성", who:"본인", when:"8월 4주"}]},

       actions:[{id:uid(), task:"HR 커뮤니티 3곳에 설명회 공지 게시", who:"본인", when:"9월 1주"}]},
      {id:uid(), obstacle:"프로그램 효과를 증명할 자료가 없다.", io:"파일럿 2개 조직의 전후 측정 결과 리포트가 확보되어 있다.", parallel:false, done:false, actions:[]},

      {id:uid(), obstacle:"운영을 도울 인력이 없다.", io:"운영 파트너 코치 2명이 계약되어 있다.", parallel:true, done:false, actions:[]}

/* ================= toast ================= */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ================= render root ================= */
function render(){
  document.getElementById("tabWizard").classList.toggle("on", view==="wizard");
  document.getElementById("tabTree").classList.toggle("on", view==="tree");
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(view==="wizard") renderWizard(app); else renderTreeView(app);
}

/* ================= wizard ================= */
const STEP_META = [
  {n:1, name:"야심찬 목표"},
  {n:2, name:"장애물"},
  {n:3, name:"중간목표(IO)"},
  {n:4, name:"순서 배열"},
  {n:5, name:"실행계획"},
  {n:6, name:"검토·완성"}
];
function maxReachableStep(){
  if(!state.target.trim()) return 1;
  if(!state.items.length) return 2;
  if(!state.items.every(i=>i.io && i.io.trim())) return 3;
  return 6;
}
function renderWizard(app){
  const reach = maxReachableStep();
  const stepsEl = document.createElement("div");
  stepsEl.className = "steps no-print";
  STEP_META.forEach(m=>{
    const b = document.createElement("button");
    b.className = "step-pill" + (m.n===step?" cur":"") + (m.n<step?" done":"");
    b.disabled = m.n > reach;
    b.innerHTML = `<span class="n">${m.n<step?"✓":m.n}</span><br>${m.name}`;
    b.onclick = ()=>{ commitStepInputs(); step = m.n; render(); };
    stepsEl.appendChild(b);
  });
  app.appendChild(stepsEl);

  const grid = document.createElement("div");
  grid.className = "wizard";
  const panel = document.createElement("section");
  panel.className = "panel";
  const guide = document.createElement("aside");
  guide.className = "guide no-print";
  grid.append(panel, guide);
  app.appendChild(grid);

  ({1:step1,2:step2,3:step3,4:step4,5:stepActions,6:stepReview})[step](panel, guide);
}

/* --- commit inputs currently on screen (so switching steps doesn't lose text) --- */
function commitStepInputs(){
  document.querySelectorAll("[data-bind]").forEach(el=>{
    const [kind,id] = el.dataset.bind.split("|");
    if(kind==="target") state.target = el.value;
    else if(kind==="title") state.title = el.value;
    else if(kind==="deadline") state.deadline = el.value;
    else if(kind==="obstacle"){ const it=findItem(id); if(it) it.obstacle = el.value; }
    else if(kind==="io"){ const it=findItem(id); if(it) it.io = el.value; }
    else if(kind==="task"||kind==="who"||kind==="when"){
      const [,iid,aid] = el.dataset.bind.split("|");
      const it = findItem(iid);
      const a = it && it.actions.find(x=>x.id===aid);
      if(a) a[kind] = el.value;
    }
  });
}

function navButtons(panel, {backTo, nextTo, nextLabel, canNext, onNext}){
  const nav = document.createElement("div");
  nav.className = "nav no-print";
  const back = document.createElement("button");
  back.className = "btn ghost";
  back.textContent = "← 이전";
  back.style.visibility = backTo? "visible":"hidden";
  back.onclick = ()=>{ commitStepInputs(); step = backTo; render(); };
  const next = document.createElement("button");
  next.className = "btn primary";
  next.textContent = nextLabel || "다음 →";
  next.onclick = ()=>{
    commitStepInputs();
    if(canNext && !canNext()) return;
    if(onNext) return onNext();
    step = nextTo; render();
  };
  nav.append(back, next);
  panel.appendChild(nav);
}

/* ---- STEP 2 : obstacles ---- */
function step2(panel, guide){
  panel.innerHTML = `
    <h2>2단계 · 장애물 나열</h2>
    <p class="sub">“그 목표는 어렵다, 왜냐하면 ___ 때문이다.” — 빈칸에 들어갈 것을 모두 꺼내 놓습니다. 지금 실제로 존재하는 조건만 적습니다.</p>

    <button class="btn ghost no-print" id="addObs" style="width:100%">＋ 장애물 추가</button>

    <div id="obsAI"></div>`;
  const list = panel.querySelector("#obsList");
  function draw(){
    commitStepInputs();
    list.innerHTML = "";
    state.items.forEach((it,i)=>{
      const row = document.createElement("div");

        <div class="idx">${i+1}</div>

        <button class="icon-btn" title="삭제">✕</button>`;
      row.querySelector(".icon-btn").onclick = ()=>{
        commitStepInputs();
        state.items = state.items.filter(x=>x.id!==it.id);
        if(state.items[0]) state.items[0].parallel=false;
        draw();
      };
      list.appendChild(row);
      const fb = aiFb.obstacles[it.id];

        const chip = document.createElement("div");
        chip.className = "fb " + (fb.isValid? "ok":"bad");

        list.appendChild(chip);
      }
    });
    drawAI();
  }
  function drawAI(){
    const box = panel.querySelector("#obsAI");
    box.innerHTML = "";
    if(aiFb.obstacleOverall){
      box.innerHTML += `<div class="ai-overall"><b>AI 총평</b> — ${esc(aiFb.obstacleOverall)}</div>`;
    }
    if(aiFb.obstacleSugs.length){
      const s = document.createElement("div");
      s.className = "ai-sugs";
      s.innerHTML = `<h4>AI 추가 장애물 제안</h4>` + aiFb.obstacleSugs.map((t,i)=>`
        <div class="ai-sug-row"><span>${esc(t)}</span>
          <button data-a="add" data-i="${i}">＋ 추가</button>
          <button data-a="hide" data-i="${i}" class="hide">숨김</button></div>`).join("");

        const t = aiFb.obstacleSugs[+b.dataset.i];

        if(b.dataset.a==="add"){ commitStepInputs(); const it = newItem(); it.obstacle = t; state.items.push(it); }
        else aiFb.excluded.push(t);
        draw();
      });
      box.appendChild(s);
    }
  }
  panel.querySelector("#aiObs").onclick = ()=>{
    commitStepInputs();
    state.items = state.items.filter(it=>it.obstacle.trim() || it.io.trim());
    if(!state.items.length){ toast("장애물을 먼저 1개 이상 적어 주세요"); draw(); return; }
    ensureAI(async ()=>{
      const btn = panel.querySelector("#aiObs");
      btn.disabled = true; btn.innerHTML = `<span class="spin" style="border-color:rgba(26,122,92,.3);border-top-color:var(--green-700)"></span> AI 검토 중…`;
      try{
        const r = await aiObstacleReview();
        aiFb.obstacleOverall = r.overall||"";
        (r.feedbacks||[]).forEach(f=>{ aiFb.obstacles[f.id] = f; });
        const have = new Set(state.items.map(i=>i.obstacle.trim()));
        aiFb.obstacleSugs = (r.suggestions||[]).filter(t=>!have.has(t.trim()));
        draw();
      }catch(e){ toast(e.message||"AI 호출에 실패했습니다"); }

      <li><b>실재하는 조건만</b> — 걱정·추측이 아니라 지금 존재하는 사실을 적습니다.</li>

      <li><b>부정형이 자연스럽습니다</b> — “~이 없다 / ~이 부족하다 / ~을 모른다”.</li>
    </ul>
    <div class="q">점검 질문 — “이것이 정말 목표 달성을 막고 있는가? 지금 실제로 존재하는가?”</div>
    <div class="ex"><b>권장 개수</b><br>보통 4~10개가 나옵니다. 2개 이하라면 목표가 충분히 야심찬지 다시 살펴보세요.</div>`;

    state.items = state.items.filter(it=>it.obstacle.trim() || it.io.trim());
    if(state.items[0]) state.items[0].parallel=false;

    return true;
  }});
}

        ${fb? `<div class="fb ${fb.isValid?"ok":"bad"}" style="margin-left:0"><b>${fb.isValid?"✓ AI":"! AI"}</b> ${esc(fb.feedback)}</div>`:""}
        ${map? `<div class="ai-sug-row" style="margin-top:6px"><span>✦ ${esc(map)}</span><button data-id="${it.id}">적용</button></div>`:""}
        <div class="check">점검 — 이 상태가 되면 위 장애물은 정말 사라집니까?</div>`;
      const applyBtn = box.querySelector(".ai-sug-row button");
      if(applyBtn) applyBtn.onclick = ()=>{
        const t = aiFb.ioMaps[it.id];
        delete aiFb.ioMaps[it.id];
        box.querySelector("textarea").value = t;   /* draw()의 commit이 이 값을 읽도록 DOM에 먼저 반영 */
        draw();
      };
      list.appendChild(box);
    });
  }
  draw();
  panel.querySelector("#aiIO").onclick = ()=>{
    commitStepInputs();
    ensureAI(async ()=>{
      const btn = panel.querySelector("#aiIO");
      btn.disabled = true; btn.innerHTML = `<span class="spin" style="border-color:rgba(26,122,92,.3);border-top-color:var(--green-700)"></span> AI 분석 중…`;
      try{
        const r = await aiIOReview();
        (r.feedbacks||[]).forEach(f=>{ aiFb.ios[f.id] = f; });
        (r.mappings||[]).forEach(m=>{ const it=findItem(m.id); if(it && !it.io.trim()) aiFb.ioMaps[m.id] = m.io; });
        draw();
      }catch(e){ toast(e.message||"AI 호출에 실패했습니다"); }
      finally{ btn.disabled = false; btn.innerHTML = "✦ AI로 변환 제안 · 작성한 IO 검토"; }
    });
  };
  guide.innerHTML = `
    <h3>◈ 방법론 가이드</h3>
    <ul>
      <li><b>상태로, 완료형으로</b> — “만든다”가 아니라 “완성되어 있다”. 달성 여부를 판별할 수 있는 문장으로.</li>
      <li><b>장애물과 1:1 대응</b> — 각 중간목표는 자기 장애물을 정확히 무력화해야 합니다(충분성).</li>
      <li><b>방법은 아직 묻지 않기</b> — ‘어떻게’는 나무가 완성된 뒤의 일입니다. 여기서는 ‘무엇이 되어 있어야 하는가’만.</li>
    </ul>
    <div class="q">점검 질문 — “이 중간목표가 달성되면, 해당 장애물은 더 이상 나를 막지 못하는가?”</div>
    <div class="ex"><b>예시</b><br>장애물: 기업 고객을 만날 접점이 없다.<br>→ IO: HR 담당자 대상 무료 설명회 채널이 운영되고 있다.</div>`;
  navButtons(panel, {backTo:2, nextTo:4, canNext(){
    if(!state.items.every(it=>it.io.trim())){ toast("모든 장애물에 중간목표를 적어 주세요"); return false; }
    return true;
  }});
}

/* ---- STEP 4 : sequencing ---- */
function step4(panel, guide){
  panel.innerHTML = `
    <h2>4단계 · 중간목표 순서 배열</h2>
    <p class="sub">달성해야 하는 순서대로 배열합니다. <b>맨 위가 가장 먼저(1단)</b>, 아래로 갈수록 나중입니다. 동시에 진행할 수 있는 중간목표는 같은 단으로 묶습니다.</p>
    <div class="seq-help">의존 관계 질문 — “이 중간목표를 달성하려면, 그 전에 반드시 달성돼 있어야 하는 중간목표는 무엇인가?”</div>
    <div class="seq-list" id="seqList"></div>
    <button class="coach-btn no-print" id="aiSeq">✦ AI 순서 제안 · 현재 순서 평가</button>
    <div id="seqAI"></div>`;
  const listEl = panel.querySelector("#seqList");
  let dragId = null;

  function drawSeqAI(){
    const box = panel.querySelector("#seqAI");
    box.innerHTML = "";
    const r = aiFb.seq;
    if(!r) return;
    box.innerHTML = `<div class="ai-overall" style="margin-top:12px">
      ${typeof r.score==="number"? `<span class="ai-score">현재 순서 ${r.score}/10</span> `:""}
      <b>AI 조언</b> — ${esc(r.advice||"")}
      ${r.levels? `<div style="margin-top:8px">${r.levels.map((g,i)=>`<b>${i+1}단</b>: ${g.map(id=>{const it=findItem(id);return it?esc(it.io):"";}).filter(Boolean).join(" ∥ ")}`).join("<br>")}
      <button class="btn primary" id="applySeq" style="margin-top:10px;padding:7px 14px;font-size:13px">이 순서 적용</button></div>`:""}
    </div>`;
    const ap = box.querySelector("#applySeq");
    if(ap) ap.onclick = ()=>{
      const ordered = [];
      r.levels.forEach(g=>{
        g.forEach((id,j)=>{
          const it = findItem(id);
          if(it && !ordered.includes(it)){ it.parallel = j>0; ordered.push(it); }
        });
      });
      state.items.forEach(it=>{ if(!ordered.includes(it)){ it.parallel=false; ordered.push(it); } });
      state.items = ordered;
      if(state.items[0]) state.items[0].parallel = false;
      aiFb.seq.levels = null;
      draw(); drawSeqAI();
      toast("AI 제안 순서를 적용했습니다");
    };
  }
  panel.querySelector("#aiSeq").onclick = ()=>{
    ensureAI(async ()=>{
      const btn = panel.querySelector("#aiSeq");
      btn.disabled = true; btn.innerHTML = `<span class="spin" style="border-color:rgba(26,122,92,.3);border-top-color:var(--green-700)"></span> AI 분석 중…`;
      try{ aiFb.seq = await aiSequenceReview(); drawSeqAI(); }
      catch(e){ toast(e.message||"AI 호출에 실패했습니다"); }
      finally{ btn.disabled = false; btn.innerHTML = "✦ AI 순서 제안 · 현재 순서 평가"; }
    });
  };
  drawSeqAI();

  function draw(){
    listEl.innerHTML = "";
    const lv = levels();
    let li = 0;
    state.items.forEach((it,i)=>{
      const isNewLevel = (i===0 || !it.parallel);
      if(isNewLevel && i>0) li++;
      const row = document.createElement("div");
      row.className = "seq-item";
      row.draggable = true;
      row.innerHTML = `
        <div class="lv">${li+1}단</div>
        <div class="txt">${esc(it.io)}<small>장애물: ${esc(it.obstacle)}</small></div>
        <button class="par ${it.parallel?"on":""}" ${i===0?"disabled":""} title="바로 위 항목과 같은 단(동시 진행)으로 묶기">${it.parallel?"∥ 동시 진행":"∥ 동시로"}</button>
        <div class="mv">
          <button data-d="-1" ${i===0?"disabled":""}>▲</button>
          <button data-d="1" ${i===state.items.length-1?"disabled":""}>▼</button>
        </div>`;
      row.querySelector(".par").onclick = ()=>{ it.parallel = !it.parallel; draw(); };
      row.querySelectorAll(".mv button").forEach(b=>b.onclick = ()=>{
        const d = +b.dataset.d, j = i+d;
        [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
        state.items[0].parallel = false;
        draw();
      });
      row.addEventListener("dragstart", ()=>{ dragId = it.id; row.classList.add("dragging"); });
      row.addEventListener("dragend", ()=>{ dragId = null; draw(); });
      row.addEventListener("dragover", e=>e.preventDefault());
      row.addEventListener("drop", e=>{
        e.preventDefault();
        if(!dragId || dragId===it.id) return;
        const from = state.items.findIndex(x=>x.id===dragId);
        const moved = state.items.splice(from,1)[0];
        const to = state.items.findIndex(x=>x.id===it.id);
        state.items.splice(to,0,moved);
        state.items[0].parallel = false;
        draw();
      });
      listEl.appendChild(row);
    });
  }
  draw();

  guide.innerHTML = `
    <h3>◈ 방법론 가이드</h3>
    <ul>
      <li><b>시간·논리 순서</b> — 먼저 갖춰져야 다음이 가능한 것부터. 인과가 아니라 <b>선행 조건</b> 관계입니다.</li>
      <li><b>같은 단 = 동시 진행</b> — 서로 선후가 없는 중간목표는 “∥ 동시로”를 눌러 같은 단에 둡니다.</li>
      <li><b>드래그 또는 ▲▼</b>로 순서를 바꿉니다.</li>
    </ul>
    <div class="q">점검 질문 — “아래 단을 건너뛰고 이 단을 먼저 달성할 수 있는가? 있다면 순서를 다시 보세요.”</div>
    <div class="ex"><b>왜 순서가 중요한가?</b><br>순서가 잡히면 나무는 곧바로 실행 로드맵이 됩니다. ‘지금 무엇부터 할지’가 저절로 드러납니다.</div>`;
  navButtons(panel, {backTo:3, nextTo:5, nextLabel:"다음: 실행계획 →"});
}

/* ---- STEP 5 : action plan ---- */

          row.className = "ap-row";

              draw();
            }catch(e){ toast(e.message||"AI 호출에 실패했습니다"); b.disabled=false; b.textContent="✦ AI 활동 3개 제안"; }
          });
        };
        list.appendChild(box);
      });

  }
  draw();

      <li><b>IO는 상태, 활동은 행동</b> — 나무의 중간목표는 '도달할 상태'이고, 실행계획은 그 상태를 만드는 '구체적 행동'입니다. 여기서 비로소 '어떻게'를 다룹니다.</li>
      <li><b>1단부터</b> — 지금 시작할 수 있는 아래 단의 활동이 가장 구체적이어야 합니다. 위 단은 대략적이어도 됩니다.</li>

/* ================= tree ================= */
function renderTree(container, {editable}){
  container.innerHTML = "";
  if(!state.target.trim() && !state.items.length){
    container.innerHTML = `<div class="empty"><div class="big">🌱</div>아직 목표나무가 없습니다.<br>마법사에서 야심찬 목표부터 세워 보세요.<br><button class="btn primary" onclick="view='wizard';step=1;render()">마법사 시작하기</button></div>`;
    return;
  }
  const lv = levels();
  const total = state.items.length;
  const done = state.items.filter(i=>i.done).length;

  if(editable && total){
    const p = document.createElement("div");
    p.className = "progress-line no-print";
    p.innerHTML = `<small>중간목표 달성 ${done} / ${total}</small><div class="bar"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>`;
    container.appendChild(p);
  }

  const tree = document.createElement("div");
  tree.className = "tree";

  const goal = document.createElement("div");
  goal.className = "goal-node";
  goal.innerHTML = `<div class="tag">AMBITIOUS TARGET · 야심찬 목표</div>
    <div class="txt">${esc(state.target)||"<i>목표 미입력</i>"}</div>
    ${state.deadline?`<div class="by">⏱ ${esc(state.deadline)}</div>`:""}`;
  tree.appendChild(goal);

  const arrow = ()=>{
    const a = document.createElement("div");
    a.className = "tree-arrow";
    a.innerHTML = `<svg width="26" height="30" viewBox="0 0 26 30"><path d="M13 28 V6 M5 13 L13 4 L21 13" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return a;
  };

  /* levels rendered top(=last) → bottom(=first) */
  for(let i=lv.length-1; i>=0; i--){
    tree.appendChild(arrow());
    const level = document.createElement("div");
    level.className = "level";
    level.innerHTML = `<div class="level-label">${LEVEL_NAMES(i)}${i===0?" · 여기서 시작":""}</div>`;
    const cards = document.createElement("div");
    cards.className = "level-cards";
    lv[i].forEach(it=>{
      const c = document.createElement("div");
      c.className = "io-card" + (it.done?" done":"");
      c.innerHTML = `
        <div class="io-txt">${esc(it.io)||"<i>중간목표 미입력</i>"}</div>
        <div class="ob-txt"><b>극복할 장애물</b><br>${esc(it.obstacle)}</div>
        <div class="card-foot">
          <label class="done-toggle"><input type="checkbox" ${it.done?"checked":""} ${editable?"":"disabled"}> 달성</label>
          ${editable?`<button class="edit-link">편집</button>`:""}
        </div>`;
      const cb = c.querySelector("input");
      cb.onchange = ()=>{ it.done = cb.checked; render(); };
      if(editable) c.querySelector(".edit-link").onclick = ()=>openEditModal(it.id);
      cards.appendChild(c);
    });
    level.appendChild(cards);
    tree.appendChild(level);
  }
  container.appendChild(tree);
}

/* ---- edit modal ---- */
function openEditModal(id, isNew){
  const it = findItem(id);
  if(!it) return;
  const idx = state.items.indexOf(it);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">
    <h3>${isNew?"중간목표 추가":"중간목표 편집"}</h3>
    <div class="field"><label>중간목표 (달성된 상태로 서술)</label><textarea id="mIo" rows="2">${esc(it.io)}</textarea></div>
    <div class="field"><label>이 중간목표가 극복하는 장애물</label><textarea id="mOb" rows="2">${esc(it.obstacle)}</textarea></div>
    <div class="field"><label>위치</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" id="mUp" ${idx===0?"disabled":""}>▲ 한 칸 먼저</button>
        <button class="btn ghost" id="mDown" ${idx===state.items.length-1?"disabled":""}>▼ 한 칸 나중</button>
        <button class="btn ghost" id="mPar" ${idx===0?"disabled":""}>${it.parallel?"∥ 동시 진행 해제":"∥ 위 항목과 동시 진행"}</button>
      </div></div>
    <div class="nav">
      <button class="btn ghost danger" id="mDel">삭제</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" id="mCancel">취소</button>
        <button class="btn primary" id="mOk">확인</button>
      </div></div></div>`;
  document.body.appendChild(bg);
  const q = s=>bg.querySelector(s);
  const commit = ()=>{ it.io = q("#mIo").value; it.obstacle = q("#mOb").value; };
  const close = ()=>{ bg.remove(); render(); };
  q("#mUp").onclick = ()=>{ commit(); const j=idx-1; [state.items[idx],state.items[j]]=[state.items[j],state.items[idx]]; state.items[0].parallel=false; close(); openEditModal(id); };
  q("#mDown").onclick = ()=>{ commit(); const j=idx+1; [state.items[idx],state.items[j]]=[state.items[j],state.items[idx]]; state.items[0].parallel=false; close(); openEditModal(id); };
  q("#mPar").onclick = ()=>{ commit(); it.parallel=!it.parallel; close(); openEditModal(id); };
  q("#mDel").onclick = ()=>{
    if(!isNew && !confirm("이 중간목표를 삭제할까요?")) return;
    state.items = state.items.filter(x=>x.id!==id);
    if(state.items[0]) state.items[0].parallel=false;
    close();
  };
  q("#mCancel").onclick = ()=>{ if(isNew){ state.items = state.items.filter(x=>x.id!==id); } close(); };
  q("#mOk").onclick = ()=>{
    commit();
    if(!it.io.trim()){ toast("중간목표를 입력해 주세요"); return; }
    close();
  };
  bg.onclick = e=>{ if(e.target===bg) q("#mCancel").click(); };
  q("#mIo").focus();
}

/* ================= target coach (진단 + 수정안) ================= */
const ai = { key:"", model:"claude-sonnet-4-5" };   /* 세션 메모리에만 보관 — 어디에도 저장되지 않음 */

function analyzeTarget(target, deadline){
  const t = (target||"").trim();
  const all = t + " " + (deadline||"");
  const hasDeadline = /(까지|이내|안에|내에)/.test(all) || /\d+\s*(년|개월|월|주|일)/.test(all);
  const hasNumber = /\d/.test(t) || /(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(명|곳|개|건|회|배|팀|호|권)/.test(t);
  const vague = t.match(/노력|최선|열심히|향상|개선|강화|활성화|극대화|확대|성장(?!률)|잘\s|많이|꾸준히/g);
  const wish = /(싶다|바란다|희망한다|되었으면|해야\s?한다)\.?$/.test(t);
  const sentences = t.split(/[.!?]/).map(s=>s.trim()).filter(s=>s.length>3);
  const multi = sentences.length > 1 || /(그리고|하는 동시에|함과 동시에|및)/.test(t) && t.length > 40;
  return [
    {ok: hasDeadline, label:"기한이 있다",
     tip: hasDeadline? "달성 시점이 드러나 있습니다." : "‘언제까지’가 없으면 달성 여부를 영영 판정할 수 없습니다. 시점을 못 박으세요."},
    {ok: hasNumber, label:"판별 가능한 지표가 있다",
     tip: hasNumber? "숫자·지표가 있어 달성 여부를 판정할 수 있습니다." : "숫자가 하나도 없습니다. ‘무엇이 얼마나’ 되면 달성인지 지표를 넣으세요."},
    {ok: !(vague||wish), label:"달성된 상태로 서술되어 있다",
     tip: (vague||wish)? ("‘" + (vague? vague[0] : "…"+t.slice(-6)) + "’ — 활동·바람의 언어입니다. 도달한 결과 상태로 바꿔 쓰세요. (“노력한다” ✕ → “확보한다” ○)")
                        : "결과 상태의 언어로 서술되어 있습니다."},
    {ok: !multi, label:"목표가 하나다",
     tip: multi? "목표가 여러 개로 읽힙니다. 나무 하나에는 목표 하나 — 가장 중요한 것 하나로 좁히세요." : "하나의 결과에 집중되어 있습니다."},
    {ok: null, label:"야심찬가? (직접 점검)",
     tip:"지금의 방식 그대로면 어렵게 느껴지는가? 장애물이 여럿 떠오르는가? — ‘예’라면 좋은 목표입니다."}
  ];
}

function offlineSuggestions(target, deadline){
  const stem = (target||"").trim().replace(/[.!?…\s]+$/,"");
  const diag = analyzeTarget(target, deadline);
  const needDl = !diag[0].ok, needNum = !diag[1].ok;
  const addDl = needDl? " (기한: ◻년 ◻월까지)" : "";
  const addNum = needNum? " — 성공 지표: ◻(무엇)이 ◻(얼마나)" : "";
  return [
    {text: stem + addDl + addNum + ".",
     why: (needDl||needNum)? "원문을 유지하면서 빠진 요소(기한·지표)를 빈칸(◻)으로 추가한 안입니다. 빈칸을 채워 완성하세요."
                           : "원문에 판정 기준을 덧붙인 안입니다. 빈칸을 채워 완성하세요."},
    {text: "◻년 ◻월의 모습: " + stem + ". 그 증거로 ◻(구체적 결과물·지표)가 실제로 존재한다.",
     why: "‘이미 달성된 미래의 하루’를 묘사하는 완료 상태 문형입니다. 증거를 명시하면 활동이 아닌 상태가 됩니다."},
    {text: stem + " — ◻(지표)가 ◻(기준값) 이상이면 달성한 것으로 본다.",
     why: "마감일에 누구나 예/아니오로 답할 수 있게 판정 규칙을 문장에 포함한 안입니다."}
  ];
}

const AI_SYS = "당신은 TOC(제약이론) 사고 프로세스의 야심찬 목표나무(Ambitious Target Tree) 전문 코치다. 성인·조직 워크숍 톤의 자연스러운 한국어를 쓴다. 반드시 유효한 JSON만 출력한다 — 설명 문장이나 코드펜스를 붙이지 않는다.";

async function claudeCall(usr, maxTokens){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": ai.key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({ model: ai.model, max_tokens: maxTokens||1500, system: AI_SYS, messages:[{role:"user", content:usr}] })
  });
  if(!res.ok){
    const msg = res.status===401? "API 키가 올바르지 않습니다." :
                res.status===429? "요청 한도를 초과했습니다. 잠시 후 다시 시도하세요." :
                "API 오류 (" + res.status + ")";
    throw new Error(msg);
  }
  const data = await res.json();
  const raw = (data.content||[]).map(c=>c.text||"").join("");
  const m = raw.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("응답을 해석하지 못했습니다. 다시 시도해 주세요.");
  return JSON.parse(m[0]);
}

      </div>`).join("")}
    </div>
    ${okAll? `<p class="sug-note">형식 기준은 통과했습니다. 아래 수정안은 표현을 더 다듬는 참고안입니다.</p>`:""}
    <div class="sug-head">
      <h4>수정안 3가지</h4>
      <span class="src" id="sugSrc">문형 제안 (오프라인)</span>
    </div>
    <div id="sugErr"></div>
    <div id="sugList"></div>
    <p class="sug-note" id="sugNote">◻ 표시는 직접 채울 빈칸입니다. AI를 연결하면 목표에 맞춘 완성형 수정안을 받을 수 있습니다.</p>
    <details class="ai-box" id="aiBox">
      <summary>AI 연결 (Claude API) — 맞춤 수정안 받기</summary>
      <div class="inner">
        <input type="password" id="aiKey" placeholder="Claude API 키 (sk-ant-…)" autocomplete="off">
        <div class="note">키는 이 화면의 메모리에서만 쓰이고 <b>어디에도 저장·전송되지 않습니다</b> (Anthropic API 호출에만 사용). 호출마다 소액의 API 비용이 발생합니다. 키 발급: console.anthropic.com</div>
        <button class="ai-run" id="aiRun">✦ AI 수정안 생성</button>
      </div>
    </details>
    <div class="nav"><span></span><button class="btn ghost" id="coachClose">닫기</button></div>
  </div>`;
  document.body.appendChild(bg);
  const q = s=>bg.querySelector(s);

  function drawSuggestions(list, isAI){
    q("#sugSrc").textContent = isAI? "AI 수정안 (Claude)" : "문형 제안 (오프라인)";
    q("#sugSrc").classList.toggle("ai", !!isAI);
    q("#sugNote").style.display = isAI? "none":"";
    q("#sugList").innerHTML = list.map((s,i)=>`
      <div class="sug-card">
        <div class="t">${esc(s.text)}</div>
        <div class="w">${esc(s.why||"")}</div>
        <button class="use" data-i="${i}">이 안 사용</button>
      </div>`).join("");
    q("#sugList").querySelectorAll(".use").forEach(b=>b.onclick = ()=>{
      state.target = list[+b.dataset.i].text;
      bg.remove(); render();
      toast(isAI? "AI 수정안을 적용했습니다" : "문형을 적용했습니다 — ◻ 빈칸을 채워 완성하세요");
      const ta = document.querySelector('textarea[data-bind="target|"]');
      if(ta) ta.focus();
    });
  }
  drawSuggestions(offlineSuggestions(state.target, state.deadline), false);

  if(ai.key) q("#aiKey").value = ai.key;
  q("#aiRun").onclick = async ()=>{
    ai.key = q("#aiKey").value.trim();
    q("#sugErr").innerHTML = "";
    if(!ai.key){ q("#sugErr").innerHTML = `<div class="ai-err">API 키를 입력해 주세요.</div>`; return; }
    const btn = q("#aiRun");
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> 생성 중…`;
    try{
      const sugs = await aiSuggest(state.target, state.deadline);
      drawSuggestions(sugs, true);
      q("#aiBox").open = false;
    }catch(e){
      q("#sugErr").innerHTML = `<div class="ai-err">${esc(e.message||"오류가 발생했습니다.")} ${/Failed to fetch/i.test(e.message||"")? "네트워크 연결 또는 방화벽을 확인해 주세요.":""}</div>`;
    }finally{
      btn.disabled = false; btn.innerHTML = "✦ AI 수정안 생성";
    }
  };
  q("#coachClose").onclick = ()=>bg.remove();
  bg.onclick = e=>{ if(e.target===bg) bg.remove(); };
}

/* ================= export (PDF / PNG) ================= */
function loadScript(src){
  return new Promise((ok,no)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ()=>no(new Error("라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하거나 '인쇄'를 이용해 주세요."));
    document.head.appendChild(s);
  });
}
function withTreeView(cb){
  commitStepInputs();
  if(view!=="tree"){ view = "tree"; render(); }
  setTimeout(cb, 120);
}
function exportName(){ return (state.title||"목표나무").replace(/[\\/:*?"<>|]/g,"_"); }

async function exportPNG(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  const el = document.querySelector(".tree-board");
  if(!el){ toast("내보낼 나무가 없습니다"); return; }
  document.body.classList.add("exporting");
  let canvas;
  try{ canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true}); }
  finally{ document.body.classList.remove("exporting"); }
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = exportName() + ".png";
  document.body.appendChild(a); a.click();
  setTimeout(()=>a.remove(), 500);
  toast("PNG 이미지로 저장했습니다");
}
async function exportPDF(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const el = document.querySelector(".tree-board");
  if(!el){ toast("내보낼 나무가 없습니다"); return; }
  document.body.classList.add("exporting");
  let canvas;
  try{ canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true}); }
  finally{ document.body.classList.remove("exporting"); }
  const pdf = new jspdf.jsPDF("p","mm","a4");
  const margin = 10, iw = 210 - margin*2, ihPage = 297 - margin*2;
  const pxPerMm = canvas.width / iw;
  const pageHpx = Math.floor(ihPage * pxPerMm);
  let y = 0, first = true;
  while(y < canvas.height){
    const h = Math.min(pageHpx, canvas.height - y);
    const slice = document.createElement("canvas");
    slice.width = canvas.width; slice.height = h;
    slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if(!first) pdf.addPage();
    pdf.addImage(slice.toDataURL("image/jpeg",0.92), "JPEG", margin, margin, iw, h/pxPerMm);
    first = false; y += pageHpx;
  }
  pdf.save(exportName() + ".pdf");
  toast("PDF로 저장했습니다");
}

/* ================= header events ================= */
document.getElementById("btnAI").onclick = ()=>openAISettings(()=>toast("AI가 연결되었습니다 — 각 단계의 ✦ 버튼을 사용해 보세요"));
document.getElementById("btnPng").onclick = ()=>withTreeView(()=>exportPNG().catch(e=>toast(e.message||"PNG 저장에 실패했습니다")));
document.getElementById("btnPdf").onclick = ()=>withTreeView(()=>exportPDF().catch(e=>toast(e.message||"PDF 저장에 실패했습니다")));
document.getElementById("tabWizard").onclick = ()=>{ commitStepInputs(); view="wizard"; render(); };
document.getElementById("tabTree").onclick = ()=>{ commitStepInputs(); view="tree"; render(); };
document.getElementById("btnSave").onclick = ()=>{ commitStepInputs(); saveFile(); };
document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value=""; };
document.getElementById("btnPrint").onclick = ()=>{
  commitStepInputs();
  const prev = view;
  view = "tree"; render();
  setTimeout(()=>{ window.print(); view = prev; render(); }, 60);
};
document.getElementById("btnNew").onclick = ()=>{
  commitStepInputs();
  if((state.target.trim()||state.items.length) && !confirm("현재 작업 내용이 사라집니다. 저장하지 않았다면 먼저 ‘저장’을 눌러 주세요.\n새로 시작할까요?")) return;
  state = blankState(); step = 1; view = "wizard"; checkboxes = {};
  render();
};
document.getElementById("btnExample").onclick = ()=>{
  commitStepInputs();
  if((state.target.trim()||state.items.length) && !confirm("현재 작업 내용을 예시로 덮어씁니다. 계속할까요?")) return;
  loadExample();
};
window.addEventListener("beforeunload", e=>{
  if(state.target.trim()||state.items.length){ e.preventDefault(); e.returnValue=""; }
});

render();
</script>
