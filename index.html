<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thomas G AI App Gallery · 지평의 AI 앱 갤러리</title>
<style>
  :root {
    --bg: #faf9f5;
    --card: #ffffff;
    --ink: #2d2a26;
    --ink-soft: #6b655c;
    --line: #e8e4dc;
    --accent: #d97757;
    --accent-soft: #fdf0eb;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }

  header { margin-bottom: 22px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--accent); text-transform: uppercase;
    background: var(--accent-soft); padding: 5px 12px; border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .subtitle { font-size: 15px; color: var(--ink-soft); line-height: 1.6; }

  .tabs { display: flex; gap: 6px; margin: 22px 0 16px; background: #efece5; padding: 5px; border-radius: 14px; width: fit-content; }
  .tab {
    border: none; background: transparent; color: var(--ink-soft);
    border-radius: 10px; padding: 9px 20px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .tab.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(45,42,38,0.08); }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .stat-chip {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--ink-soft);
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .stat-chip b { color: var(--ink); font-weight: 700; margin-right: 2px; }
  .stat-chip:hover { border-color: var(--accent); }
  .stat-chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .stat-chip.on b { color: #fff; }
  .st-select {
    border: none; -webkit-appearance: none; appearance: none; outline: none;
    font-family: inherit; cursor: pointer;
  }
  .en { font-weight: 600; color: #a8a195; font-size: 0.85em; }
  .stat-chip.on .en { color: #d8d3c9; }
  .fix-flag {
    border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 11.5px; opacity: 0.3; padding: 3px 7px; border-radius: 999px; transition: all 0.15s;
  }
  .fix-flag:hover { opacity: 0.7; }
  .fix-flag.on { opacity: 1; background: #fde8e3; color: #a03e2e; font-weight: 700; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .search {
    flex: 1 1 220px; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px;
  }
  .search input {
    border: none; outline: none; background: transparent;
    font-size: 14px; width: 100%; font-family: inherit; color: var(--ink);
  }
  select {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font-size: 13px; font-family: inherit; color: var(--ink);
    cursor: pointer; outline: none;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
    text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); color: #fff; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 24px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ── 갤러리 카드 ── */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(45,42,38,0.09); }
  .cover {
    height: 92px; display: flex; align-items: center; justify-content: center;
    font-size: 38px; position: relative;
  }
  .cover .badge-new {
    position: absolute; top: 10px; left: 10px;
    background: rgba(255,255,255,0.92); color: var(--accent);
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  }
  .cover .badge-private {
    position: absolute; top: 10px; right: 10px;
    background: rgba(45,42,38,0.75); color: #fff;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
  .card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 5px; }
  .desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; flex: 1; margin-bottom: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
  .ai-badge { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .st-badge { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .date { font-size: 11.5px; color: #a09a90; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; justify-content: center; padding: 9px 10px; font-size: 12.5px; }
  .actions .btn.ghost { color: var(--ink-soft); }
  .actions .btn.ghost:hover { color: var(--accent); }
  .card-foot { display: flex; justify-content: flex-end; gap: 14px; margin-top: 10px; }
  .edit-link {
    background: none; border: none; color: #b8b2a8; font-size: 11.5px;
    font-family: inherit; cursor: pointer;
  }
  .edit-link:hover { color: var(--accent); }

  .empty { text-align: center; color: var(--ink-soft); padding: 60px 0; font-size: 14px; }

  /* ── 칸반보드 ── */
  .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 16px; }
  .col {
    flex: 1 0 208px; min-width: 208px; background: #f2efe8; border-radius: 14px;
    padding: 12px 10px 14px; border: 2px solid transparent; transition: border-color 0.15s;
  }
  .col.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; align-items: center; gap: 6px; padding: 2px 6px 10px; }
  .col-head h4 { font-size: 13.5px; font-weight: 800; }
  .col-count {
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    background: #fff; border-radius: 999px; padding: 1px 8px;
  }
  .bcard {
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 12px; margin-bottom: 8px; cursor: grab; font-size: 13.5px;
    transition: box-shadow 0.15s;
  }
  .bcard:hover { box-shadow: 0 4px 14px rgba(45,42,38,0.1); }
  .bcard:active { cursor: grabbing; }
  .bcard .b-title { font-weight: 700; display: flex; gap: 6px; align-items: flex-start; line-height: 1.35; }
  .bcard .b-memo { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
  .bcard .b-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .bcard .ai-badge { font-size: 10px; padding: 2px 8px; }
  .bcard a { color: var(--ink-soft); text-decoration: none; font-size: 11.5px; }
  .bcard a:hover { color: var(--accent); }
  .b-edit { background: none; border: none; cursor: pointer; color: #c5bfb4; font-size: 12px; margin-left: auto; font-family: inherit; }
  .b-edit:hover { color: var(--accent); }
  .idea-input {
    width: 100%; border: 1px dashed #cfc8bb; border-radius: 10px; background: #fffdf8;
    padding: 9px 11px; font-size: 12.5px; font-family: inherit; outline: none; margin-bottom: 8px; color: var(--ink);
  }
  .idea-input:focus { border-color: var(--accent); }
  .board-hint { font-size: 12px; color: #a09a90; margin: 4px 0 14px; }

  /* ── 다이얼로그 ── */
  dialog {
    margin: auto; border: none; border-radius: 20px; padding: 0; max-width: 440px; width: calc(100vw - 40px);
    box-shadow: 0 24px 64px rgba(45,42,38,0.25);
  }
  dialog::backdrop { background: rgba(45,42,38,0.35); }
  .dlg-body { padding: 26px 26px 22px; }
  dialog h2 { font-size: 19px; font-weight: 800; margin-bottom: 18px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fff; color: var(--ink);
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .danger { color: #c0392b !important; margin-right: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 12px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 99;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 48px; font-size: 12px; color: #b8b2a8; text-align: center; line-height: 1.7; }
  @media (max-width: 560px) { h1 { font-size: 26px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">✦ Thomas G · Vibe Coding Collection</span>
    <h1>지평의 AI 앱 갤러리</h1>
    <p class="subtitle">클로드와 함께 바이브 코딩으로 만든 앱과 웹을 한 곳에서.<br>
    갤러리에서 완성작을 보고, 칸반보드에서 아이디어부터 릴리즈까지 흐름을 관리해요.</p>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="gallery">🖼 갤러리</button>
    <button class="tab" data-view="board">📋 칸반보드</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="앱 이름·설명 검색"></div>
    <select id="sort">
      <option value="updated">최신 업데이트순</option>
      <option value="created">만든 날짜순</option>
      <option value="name">이름순</option>
    </select>
    <button class="btn" id="syncBtn">⟳ GitHub 동기화</button>
    <button class="btn primary" id="addBtn">＋ 직접 추가</button>
  </div>
  <div class="filters" id="filters"></div>

  <div id="galleryView">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">검색 결과가 없어요.</div>
  </div>

  <div id="boardView" style="display:none">
    <p class="board-hint">카드를 끌어서 다른 단계로 옮길 수 있어요. 아이디어 칸의 입력창에 적고 Enter를 누르면 인박스에 쌓입니다.</p>
    <div class="board" id="board"></div>
  </div>

  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <form class="dlg-body" id="form" method="dialog">
    <h2 id="dlgTitle">앱 직접 추가</h2>
    <div class="field-row">
      <div class="field" style="flex:0 0 76px">
        <label>이모지</label>
        <input id="f_emoji" maxlength="4" placeholder="🚀">
      </div>
      <div class="field">
        <label>앱 이름 *</label>
        <input id="f_name" required placeholder="예: 낭독 타이머">
      </div>
    </div>
    <div class="field">
      <label>한 줄 설명</label>
      <input id="f_desc" placeholder="무엇을 하는 앱인가요?">
    </div>
    <div class="field-row">
      <div class="field">
        <label>진행 상태</label>
        <select id="f_status">
          <option value="idea">💡 아이디어 · Backlog</option>
          <option value="todo">📋 작업 대기 · To Do</option>
          <option value="working">🔨 만드는 중 · In Progress</option>
          <option value="polishing">🧪 다듬는 중 · Review/Test</option>
          <option value="live">🚀 운영 중 · Live</option>
          <option value="archived">📦 보관 · Archived</option>
        </select>
      </div>
      <div class="field">
        <label>수정 필요</label>
        <select id="f_fix">
          <option value="0">아니오</option>
          <option value="1">🔧 예</option>
        </select>
      </div>
      <div class="field">
        <label>만든 AI</label>
        <select id="f_ai">
          <option>Claude</option>
          <option>ChatGPT</option>
          <option>Gemini</option>
          <option>Google AI Studio</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field">
        <label>공개 여부</label>
        <select id="f_vis">
          <option value="0">공개</option>
          <option value="1">비공개</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>열기 링크 (URL)</label>
      <input id="f_live" type="url" placeholder="https://...">
    </div>
    <div class="field">
      <label>GitHub / 소스 링크 (선택)</label>
      <input id="f_repo" type="url" placeholder="https://github.com/...">
    </div>
    <div class="field">
      <label>만든 날짜</label>
      <input id="f_date" type="date">
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="delBtn" style="display:none">삭제</button>
      <button type="button" class="btn" id="cancelBtn">취소</button>
      <button type="submit" class="btn primary" id="saveBtn">저장</button>
    </div>
  </form>
</dialog>

<dialog id="pwDlg">
  <form class="dlg-body" id="pwForm">
    <h2>🔒 비공개 앱 보기</h2>
    <div class="field">
      <label>비밀번호</label>
      <input id="pw_input" type="password" autocomplete="off" placeholder="비밀번호를 입력하세요">
    </div>
    <p id="pwErr" style="color:#c0392b;font-size:12.5px;display:none;margin:-4px 0 10px">비밀번호가 맞지 않아요.</p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="pwCancel">취소</button>
      <button type="submit" class="btn primary">잠금 해제</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

// 실수로 지운 앱 복구 (한 번만 적용 — 이후 다시 삭제하는 건 자유)
const RESTORES = [
  { key: 'restore-blanktalk-2026-07-24', ids: ['blanktalk'] },
  { key: 'reset-blanktalk-card-2026-07-24', ids: ['blanktalk'], reset: true },
];
store.appliedRestores = store.appliedRestores || [];
{
  let touched = false;
  for (const r of RESTORES) {
    if (!store.appliedRestores.includes(r.key)) {
      store.removed = store.removed.filter(id => !r.ids.includes(id));
      if (r.reset) r.ids.forEach(id => delete store.overrides[id]);
      store.appliedRestores.push(r.key);
      touched = true;
    }
  }
  if (touched) storage.save(store);
}

// 이전 상태 체계(테스트 중/수정 필요/릴리즈됨) → 새 체계로 1회 이전
{
  const MIG_KEY = 'status-migration-v2';
  if (!store.appliedRestores.includes(MIG_KEY)) {
    const migrate = (o) => {
      if (!o || !o.status) return;
      if (o.status === 'fix') { o.status = 'live'; o.fix = true; }
      else if (LEGACY_STATUS[o.status]) o.status = LEGACY_STATUS[o.status];
    };
    Object.values(store.overrides).forEach(migrate);
    store.added.forEach(migrate);
    store.discovered.forEach(migrate);
    store.appliedRestores.push(MIG_KEY);
    storage.save(store);
  }
}
let state = { q: '', ai: '전체', sort: 'updated', view: 'gallery', unlockedApps: null, status: null, fixOnly: false };

function allApps() {
  const merged = [...BASE_APPS, ...(state.unlockedApps || []), ...store.discovered, ...store.added]
    .filter(a => !store.removed.includes(a.id))
    .map(a => {
      const m = { status:'live', ...a, ...(store.overrides[a.id] || {}) };
      if (m.status === 'fix') { m.status = 'live'; m.fix = true; }
      else if (LEGACY_STATUS[m.status]) m.status = LEGACY_STATUS[m.status];
      if (!STATUS[m.status]) m.status = 'live';
      return m;
    });
  const seen = new Set();
  return merged.filter(a => seen.has(a.id) ? false : (seen.add(a.id), true));
}

function coverStyle(app, i) {

// ─────────────────────────────────────────────
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryUnlock(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64d(VAULT.salt), iterations: VAULT.iter, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(VAULT.iv) }, key, b64d(VAULT.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function openPwDialog() {
  if (!window.crypto || !crypto.subtle) { toast('이 환경에서는 잠금 해제를 지원하지 않아요'); return; }
  $('pwErr').style.display = 'none';
  $('pw_input').value = '';

  $('pw_input').focus();
}

$('pwForm').onsubmit = async (e) => {
  e.preventDefault();
  try {

    $('pwDlg').close();

};

async function syncGithub() {
  toast('GitHub에서 불러오는 중…');
  try {
    const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const repos = await res.json();
    const known = new Set(allApps().map(a => a.id).concat(store.removed));
    let added = 0, updated = 0;

    for (const r of repos) {
      if (r.fork) continue;
      if (r.name === GITHUB_USER + '.github.io') continue; // 갤러리 자신은 제외
      if (!known.has(r.name)) {
        store.discovered.push({
          id: r.name, emoji: '✨', name: r.name, isNew: true, status: 'live',
          desc: r.description || 'GitHub에서 자동으로 발견된 새 앱',
          ai: 'Claude',
          live: r.has_pages ? `https://${GITHUB_USER}.github.io/${r.name}/` : (r.homepage || ''),
          repo: r.html_url,
          created: (r.created_at||'').slice(0,10), updated: (r.pushed_at||'').slice(0,10),
        });
        added++;
      } else {
        const pushed = (r.pushed_at||'').slice(0,10);
        const app = allApps().find(a => a.id === r.name);
        if (app && pushed && app.updated !== pushed) {
          store.overrides[r.name] = { ...(store.overrides[r.name]||{}), updated: pushed };
          updated++;
        }
      }
    }
    storage.save(store);
    render();
    toast(added ? `새 앱 ${added}개를 찾았어요! 🎉` : (updated ? `업데이트 날짜 ${updated}건 갱신 완료` : '새로운 앱이 없어요. 최신 상태입니다 ✓'));
  } catch(e) {
    toast('불러오기 실패 — 네트워크가 차단된 환경일 수 있어요');
  }
}

  storage.save(store);
  render();
  toast(storage.persistent ? '저장했어요 ✓' : '반영했어요 (창을 닫기 전까지 유지돼요)');
};

$('delBtn').onclick = () => {
  if (editingId) {
    store.removed.push(editingId);
    storage.save(store);
    $('dlg').close(); render(); toast('삭제했어요');
  }
};
$('cancelBtn').onclick = () => $('dlg').close();
$('addBtn').onclick = () => openDialog(null);
$('syncBtn').onclick = syncGithub;
$('q').oninput = (e) => { state.q = e.target.value; render(); };
$('sort').onchange = (e) => { state.sort = e.target.value; render(); };

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

render();
</script>
</body>
</html>
