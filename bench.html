<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벤치마킹 노트 · Thomas G</title>
<style>
  :root {
    --bg: #f6f7f4;
    --card: #ffffff;
    --ink: #26302b;
    --ink-soft: #5f6b64;
    --line: #e2e6e0;
    --accent: #2e7d5b;
    --accent-soft: #e8f3ed;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
  header { margin-bottom: 22px; }
  .topnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--accent); text-transform: uppercase;
    background: var(--accent-soft); padding: 5px 12px; border-radius: 999px;
  }
  .backlink { font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; }
  .backlink:hover { color: var(--accent); }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .subtitle { font-size: 14.5px; color: var(--ink-soft); line-height: 1.6; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
  .stat-chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; color: var(--ink-soft);
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .stat-chip b { color: var(--ink); font-weight: 700; margin-right: 2px; }
  .stat-chip:hover { border-color: var(--accent); }
  .stat-chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .stat-chip.on b { color: #fff; }
  .en { font-weight: 600; color: #9aa8a0; font-size: 0.85em; }
  .stat-chip.on .en { color: #cdd6d1; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .search {
    flex: 1 1 220px; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  }
  .search input { border: none; outline: none; background: transparent; font-size: 14px; width: 100%; font-family: inherit; color: var(--ink); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 24px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(38,48,43,0.09); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .card h3 { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .st-select {
    border: none; -webkit-appearance: none; appearance: none; outline: none;
    font-family: inherit; cursor: pointer; flex: none;
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  }
  .desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tag { font-size: 11px; font-weight: 600; color: var(--ink-soft); background: #eef1ed; border-radius: 999px; padding: 2px 9px; }
  .note { border-radius: 10px; padding: 9px 12px; font-size: 12.5px; line-height: 1.55; margin-bottom: 7px; }
  .note.learn { background: #e8f3ed; color: #1e5c41; }
  .note.avoid { background: #fdf0eb; color: #8f4632; }
  .note b { font-weight: 700; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
  .date { font-size: 11px; color: #a3aea8; }
  .edit-link { background: none; border: none; color: #a3aea8; font-size: 11.5px; font-family: inherit; cursor: pointer; }
  .edit-link:hover { color: var(--accent); }
  .visit { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }

  .empty { text-align: center; color: var(--ink-soft); padding: 60px 20px; font-size: 14px; line-height: 1.8; }

  dialog {
    margin: auto; border: none; border-radius: 20px; padding: 0; max-width: 460px; width: calc(100vw - 40px);
    box-shadow: 0 24px 64px rgba(38,48,43,0.25);
  }
  dialog::backdrop { background: rgba(38,48,43,0.35); }
  .dlg-body { padding: 26px 26px 22px; max-height: 84vh; overflow-y: auto; }
  dialog h2 { font-size: 19px; font-weight: 800; margin-bottom: 18px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fff; color: var(--ink);
  }
  .field textarea { min-height: 64px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .danger { color: #c0392b !important; margin-right: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 12px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 99; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { margin-top: 48px; font-size: 12px; color: #a3aea8; text-align: center; line-height: 1.7; }
  @media (max-width: 560px) { h1 { font-size: 25px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topnav">
      <span class="eyebrow">🔍 Benchmarking Notes</span>
      <a class="backlink" href="https://questionschool.github.io/">← 내 앱 갤러리로</a>
    </div>
    <h1>벤치마킹 노트</h1>
    <p class="subtitle">다른 사람들이 만든 AI 웹·앱 중 배우고 싶은 것을 모아 분석하는 연구 노트.<br>
    저장할 때 <b>"배울 점" 한 줄</b>을 꼭 함께 적어두는 게 핵심이에요.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="이름·소개·메모 검색"></div>
    <button class="btn primary" id="addBtn">＋ 사이트 추가</button>
  </div>
  <div class="filters" id="tagFilters"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    아직 저장한 사이트가 없어요.<br>좋은 AI 웹을 발견하면 「＋ 사이트 추가」로 기록을 시작해 보세요.
  </div>

  <footer>Thomas G Benchmarking Notes · Made with Claude</footer>
</div>

<dialog id="dlg">
  <form class="dlg-body" id="form" method="dialog">
    <h2 id="dlgTitle">사이트 추가</h2>
    <div class="field">
      <label>이름 *</label>
      <input id="f_name" required placeholder="예: Mobbin">
    </div>
    <div class="field">
      <label>링크 (URL)</label>
      <input id="f_url" type="url" placeholder="https://...">
    </div>
    <div class="field">
      <label>한 줄 소개</label>
      <input id="f_desc" placeholder="어떤 사이트인가요?">
    </div>
    <div class="field-row">
      <div class="field">
        <label>분석 상태</label>
        <select id="f_status">
          <option value="watch">👀 봐야 함 · To Watch</option>
          <option value="analyzing">🔍 분석 중 · Analyzing</option>
          <option value="done">✅ 정리됨 · Analyzed</option>
          <option value="applied">💡 적용함 · Applied</option>
        </select>
      </div>
      <div class="field">
        <label>태그 (쉼표로 구분)</label>
        <input id="f_tags" placeholder="교육, 카드툴, 디자인">
      </div>
    </div>
    <div class="field">
      <label>💡 배울 점</label>
      <textarea id="f_learn" placeholder="내 앱에 가져오고 싶은 것"></textarea>
    </div>
    <div class="field">
      <label>⚠️ 아쉬운 점 / 피할 점</label>
      <textarea id="f_avoid" placeholder="따라 하지 말아야 할 것"></textarea>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="delBtn" style="display:none">삭제</button>
      <button type="button" class="btn" id="cancelBtn">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// 기본 데이터 (Claude가 관리)
// ─────────────────────────────────────────────
const SEED = [
  { id:'mobbin', name:'Mobbin', url:'https://mobbin.com', desc:'세계 최대 UI/UX 디자인 패턴 레퍼런스 라이브러리',
    tags:['디자인','레퍼런스'], learn:'화면을 패턴(온보딩, 검색, 결제 등)별로 분류해 보여주는 방식', avoid:'',
    status:'watch', added:'2026-07-24' },
];

const STATUS = {
  watch:     { label:'봐야 함',  en:'To Watch',  emoji:'👀', fg:'#8a6d1a', bg:'#fdf5d8' },
  analyzing: { label:'분석 중',  en:'Analyzing', emoji:'🔍', fg:'#1d5c8f', bg:'#e3f0fb' },
  done:      { label:'정리됨',   en:'Analyzed',  emoji:'✅', fg:'#1e6f4a', bg:'#e2f5ea' },
  applied:   { label:'적용함',   en:'Applied',   emoji:'💡', fg:'#6b3fa0', bg:'#f1e8fb' },
};
const STATUS_ORDER = ['watch','analyzing','done','applied'];

const storage = (() => {
  try {
    const k = '__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return {
      load: () => { try { return JSON.parse(localStorage.getItem('jipyeong-bench') || 'null'); } catch(e) { return null; } },
      save: (d) => { try { localStorage.setItem('jipyeong-bench', JSON.stringify(d)); } catch(e) {} },
      persistent: true
    };
  } catch(e) {
    let mem = null;
    return { load: () => mem, save: (d) => { mem = d; }, persistent: false };
  }
})();

let store = storage.load() || { added: [], removed: [], overrides: {} };
store.added = store.added || []; store.removed = store.removed || []; store.overrides = store.overrides || {};
let state = { q: '', status: null, tag: null };

function allSites() {
  const merged = [...SEED, ...store.added]
    .filter(s => !store.removed.includes(s.id))
    .map(s => ({ ...s, ...(store.overrides[s.id] || {}) }));
  const seen = new Set();
  return merged.filter(s => seen.has(s.id) ? false : (seen.add(s.id), true));
}

const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function filtered() {
  return allSites().filter(s =>
    (!state.status || s.status === state.status) &&
    (!state.tag || (s.tags||[]).includes(state.tag)) &&
    (!state.q || (s.name+' '+(s.desc||'')+' '+(s.learn||'')+' '+(s.avoid||'')+' '+(s.tags||[]).join(' ')).toLowerCase().includes(state.q.toLowerCase())));
}

function render() {
  const sites = allSites();

  // 상태 칩
  const by = {};
  sites.forEach(s => by[s.status] = (by[s.status]||0)+1);
  $('stats').innerHTML = `<button class="stat-chip ${!state.status?'on':''}" data-stf=""><b>${sites.length}</b>전체</button>` +
    STATUS_ORDER.filter(s => by[s]).map(s =>
      `<button class="stat-chip ${state.status===s?'on':''}" data-stf="${s}">${STATUS[s].emoji} <b>${by[s]}</b>${STATUS[s].label} <span class="en">${STATUS[s].en}</span></button>`).join('');
  $('stats').querySelectorAll('[data-stf]').forEach(b => b.onclick = () => {
    const v = b.dataset.stf;
    state.status = (v && state.status !== v) ? v : null;
    render();
  });

  // 태그 칩
  const tagCount = {};
  sites.forEach(s => (s.tags||[]).forEach(t => tagCount[t] = (tagCount[t]||0)+1));
  const tags = Object.keys(tagCount).sort((a,b) => tagCount[b]-tagCount[a]);
  $('tagFilters').innerHTML = tags.map(t =>
    `<button class="chip ${state.tag===t?'on':''}" data-tag="${esc(t)}">#${esc(t)} ${tagCount[t]}</button>`).join('');
  $('tagFilters').querySelectorAll('[data-tag]').forEach(c => c.onclick = () => {
    state.tag = state.tag === c.dataset.tag ? null : c.dataset.tag;
    render();
  });

  // 카드
  const list = filtered().sort((a,b) => (b.added||'').localeCompare(a.added||''));
  $('empty').style.display = list.length ? 'none' : 'block';
  $('grid').innerHTML = list.map(s => {
    const st = STATUS[s.status] || STATUS.watch;
    return `<div class="card">
      <div class="card-top">
        <h3>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>` : esc(s.name)}</h3>
        <select class="st-select" data-st="${esc(s.id)}" title="분석 상태 변경" style="background:${st.bg};color:${st.fg}">
          ${STATUS_ORDER.map(k => `<option value="${k}" ${k===s.status?'selected':''}>${STATUS[k].emoji} ${STATUS[k].label} · ${STATUS[k].en}</option>`).join('')}
        </select>
      </div>
      ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ''}
      ${(s.tags||[]).length ? `<div class="tags">${s.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
      ${s.learn ? `<div class="note learn"><b>💡 배울 점</b> · ${esc(s.learn)}</div>` : ''}
      ${s.avoid ? `<div class="note avoid"><b>⚠️ 피할 점</b> · ${esc(s.avoid)}</div>` : ''}
      <div class="card-foot">
        <span class="date">${esc(s.added || '')}</span>
        <button class="edit-link" data-edit="${esc(s.id)}">수정</button>
      </div>
    </div>`;
  }).join('');

  $('grid').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openDialog(b.dataset.edit));
  $('grid').querySelectorAll('[data-st]').forEach(sel => sel.onchange = () => {
    store.overrides[sel.dataset.st] = { ...(store.overrides[sel.dataset.st]||{}), status: sel.value };
    storage.save(store); render();
    toast(`${STATUS[sel.value].emoji} ${STATUS[sel.value].label}(으)로 변경했어요`);
  });
}

// ─────────────────────────────────────────────
// 추가 / 수정
// ─────────────────────────────────────────────
let editingId = null;

function openDialog(id) {
  editingId = id || null;
  const s = id ? allSites().find(x => x.id === id) : null;
  $('dlgTitle').textContent = s ? '사이트 수정' : '사이트 추가';
  $('delBtn').style.display = s ? 'inline-flex' : 'none';
  $('f_name').value = s?.name || '';
  $('f_url').value = s?.url || '';
  $('f_desc').value = s?.desc || '';
  $('f_status').value = s?.status || 'watch';
  $('f_tags').value = (s?.tags || []).join(', ');
  $('f_learn').value = s?.learn || '';
  $('f_avoid').value = s?.avoid || '';
  $('dlg').showModal();
}

$('form').onsubmit = () => {
  const data = {
    name: $('f_name').value.trim(),
    url: $('f_url').value.trim(),
    desc: $('f_desc').value.trim(),
    status: $('f_status').value,
    tags: $('f_tags').value.split(',').map(t => t.trim()).filter(Boolean),
    learn: $('f_learn').value.trim(),
    avoid: $('f_avoid').value.trim(),
  };
  if (!data.name) return;
  if (editingId) {
    store.overrides[editingId] = { ...(store.overrides[editingId]||{}), ...data };
  } else {
    const today = new Date().toISOString().slice(0,10);
    store.added.push({ id: 'b-' + Math.random().toString(36).slice(2,8), added: today, ...data });
  }
  storage.save(store); render();
  toast(storage.persistent ? '저장했어요 ✓' : '반영했어요 (창을 닫기 전까지 유지돼요)');
};

$('delBtn').onclick = () => {
  if (editingId) {
    store.removed.push(editingId);
    storage.save(store);
    $('dlg').close(); render(); toast('삭제했어요');
  }
};
$('cancelBtn').onclick = () => $('dlg').close();
$('addBtn').onclick = () => openDialog(null);
$('q').oninput = (e) => { state.q = e.target.value; render(); };

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

render();
</script>
</body>
</html>
